<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CS2 portfolio performance QA</title>
  <link rel="stylesheet" href="../../casino.css">
  <link rel="stylesheet" href="../../games/games.css">
  <link rel="stylesheet" href="../../cs2-modern-betting-ui.css">
  <link rel="stylesheet" href="../../neon777-cs2-theme.css">
  <link rel="stylesheet" href="../../cs2-desktop-workspace.css">
  <style>html,body{margin:0;min-height:100%;background:#05080d;color:#fff}.qa-note{padding:6px 12px;color:#9aa5b5;font:10px/1.3 ui-monospace,monospace}#cs2BettingGame{display:block!important;min-height:100vh}</style>
</head>
<body>
  <div class="qa-note">READ-ONLY FIXTURE · NO NETWORK OR WAGER WRITES</div>
  <main id="cs2BettingGame"></main>
  <script src="../../cs2-betting-modern.js"></script>
  <script>
    const game=Object.create(CS2ModernBettingGame.prototype);
    Object.assign(game,{
      casino:{formatCredits:value=>Number(value).toFixed(2)},events:[],bets:[],openBets:[],historyBets:[],currentBetsTab:'open',
      portfolioState:'ready',portfolioSummary:null,portfolioIntegrity:{state:'ok',issues:[]},eventPayloadRevision:null,
      selectedEvent:null,selectedOutcome:null,betMode:'single',parlayLegs:[],betAmount:100,teamLogos:null,root:document.getElementById('cs2BettingGame')
    });
    game.renderModernUI();
    game.root=document.getElementById('cs2BettingGame');
    const events=[
      {id:'alpha-1',status:'scheduled',tournamentName:'IEM Cologne',homeTeam:'Vitality',awayTeam:'Spirit',hasOdds:true,bettingStatus:'open',odds:{team1:1.75,team2:2.15},commenceTime:'2026-10-01T16:00:00Z',bestOf:3},
      {id:'beta-1',status:'scheduled',tournamentName:'BLAST Premier',homeTeam:'G2',awayTeam:'NAVI',hasOdds:true,bettingStatus:'open',odds:{team1:1.95,team2:1.90},commenceTime:'2026-10-02T16:00:00Z',bestOf:3}
    ];
    game.applyEvents(events);
    game.openBets=[
      {id:'open-old-001',type:'single',status:'pending',amount:10,odds:1.75,potentialPayout:17.5,eventId:'alpha-1',homeTeam:'Vitality',awayTeam:'Spirit',selectionName:'Vitality',placedAt:'2026-08-29T10:00:00Z'},
      {id:'open-new-002',type:'parlay',status:'pending',amount:20,odds:3.32,potentialPayout:66.4,placedAt:'2026-08-30T10:00:00Z',legs:[{selectionName:'G2',homeTeam:'G2',awayTeam:'NAVI',odds:1.95,status:'pending'},{selectionName:'Vitality',homeTeam:'Vitality',awayTeam:'Spirit',odds:1.70,status:'pending'}]}
    ].sort((a,b)=>Date.parse(b.placedAt)-Date.parse(a.placedAt));
    game.historyBets=[
      {id:'history-new-002',type:'single',status:'won',amount:25,odds:2,potentialPayout:50,homeTeam:'MOUZ',awayTeam:'FaZe',selectionName:'MOUZ',placedAt:'2026-08-28T10:00:00Z',settledAt:'2026-08-30T12:00:00Z',integrityStatus:'legacy'},
      {id:'history-old-001',type:'single',status:'lost',amount:15,odds:2.1,potentialPayout:31.5,homeTeam:'Liquid',awayTeam:'Astralis',selectionName:'Liquid',placedAt:'2026-08-27T10:00:00Z',settledAt:'2026-08-29T12:00:00Z'}
    ];
    game.portfolioSummary={openCount:2,historyCount:2,openStake:30,potentialReturn:83.9,todayWins:1,todayLosses:0};
    game.showBets('open');game.updatePortfolioSummary();game.renderPortfolioStatus();
    document.querySelectorAll('.bet-tab').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('.bet-tab').forEach(item=>{item.classList.toggle('active',item===button);item.setAttribute('aria-selected',String(item===button));});
      game.showBets(button.dataset.tab);
    }));
    window.qaGame=game;window.qaEvents=events;
  </script>
</body>
</html>
